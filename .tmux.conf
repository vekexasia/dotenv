set -sg escape-time 10

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi ')' send -X next-paragraph
bind-key -T copy-mode-vi '(' send -X previous-paragraph
set -g extended-keys on
set -g focus-events on
set -g allow-passthrough on
# OSC 8 hyperlinks: tell tmux the outer terminal (WezTerm, TERM=xterm-256color) supports them,
# else tmux strips them and apps fall back to plain 'text (url)'. Needs client reattach + app restart to take effect.
set -as terminal-features ',xterm-256color:hyperlinks'
set -as terminal-features ',wezterm:hyperlinks'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind -r H swap-window -t -1 \; previous-window
bind -r L swap-window -t +1 \; next-window

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# tabs (window list) at top, browser-tab styling
set -g status-position top
set -g status-left-length 32
set -g status-style fg=#909090,bg=#151515
set -g window-status-format " #I #W#{?#{@pi_status}, #{@pi_status},} "
set -g window-status-style fg=#909090,bg=#202020
set -g window-status-current-format " #I #W#{?#{@pi_status}, #{@pi_status},} "
set -g window-status-current-style fg=#151515,bg=#75B5AA,bold
set -g window-status-separator " "
set -g status-left "#[fg=#151515,bg=#AA759F,bold] #S #[default] "
set -g status-right "#[fg=#75B5AA] %R "
